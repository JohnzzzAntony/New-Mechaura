<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Industrial Air Filter">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="45%" stop-color="#2A2A2A"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="35%" stop-color="#4A4A4A"/>
      <stop offset="65%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#B32F00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 76V40h36"/><path d="M1124 40h36v36"/>
    <path d="M40 724v36h36"/><path d="M1160 724v36h-36"/>
  </g>

  <text x="64" y="90" fill="#FF4500" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">TECHNICAL VIEW</text>
  <text x="64" y="134" fill="#FFFFFF" font-family="'Space Grotesk',sans-serif" font-size="40" font-weight="700">Industrial Air Filter</text>

  <g>
      <ellipse cx="600" cy="224" rx="170" ry="26" fill="url(#metal)" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="430" y="250" width="340" height="300" fill="#141414" stroke="#3A3A3A" stroke-width="2"/>
      <g fill="none"><path d="M430 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M447 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M464 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M481 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M498 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M515 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M532 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M549 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M566 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M583 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M600 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M617 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M634 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M651 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M668 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M685 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M702 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M719 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M736 250V550" stroke="#3A3A3A" stroke-width="2"/><path d="M753 250V550" stroke="#3A3A3A" stroke-width="1"/><path d="M770 250V550" stroke="#3A3A3A" stroke-width="2"/></g>
      <ellipse cx="600" cy="550" rx="170" ry="26" fill="url(#metal)" stroke="#3A3A3A" stroke-width="2"/>
      <ellipse cx="600" cy="224" rx="52" ry="15" fill="#0A0A0A" stroke="#FF4500" stroke-width="2"/>
      <!-- airflow -->
      <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.75">
        <path d="M250 330h120"/><path d="M250 400h120"/><path d="M250 470h120"/>
        <path d="M355 322l16 8-16 8"/><path d="M355 392l16 8-16 8"/><path d="M355 462l16 8-16 8"/>
      </g>
      <text x="250" y="300" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="15">CONTAMINATED AIR</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M770 310L900 230"/>
    <circle cx="770" cy="310" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="910" y="235" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Pleated media pack</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M600 224L900 300"/>
    <circle cx="600" cy="224" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="910" y="305" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Sealed end cap</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M740 530L900 372"/>
    <circle cx="740" cy="530" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="910" y="377" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Anti-collapse core</text>
      <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M430 631v18"/><path d="M770 631v18"/><path d="M430 640H770"/>
  </g>
  <text x="600" y="624" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">Ø 90 – 450 mm</text>
    </g>

  <line x1="64" y1="704" x2="1136" y2="704" stroke="#242424" stroke-width="1"/>
  <text x="64" y="740" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="19">Indicative schematic — dimensions confirmed against your specification at quotation.</text>
  <text x="1136" y="740" fill="#8A8A8A" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="3">MECHAURA INTERNATIONAL</text>
</svg>
