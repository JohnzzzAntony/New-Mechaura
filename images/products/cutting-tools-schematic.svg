<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Cutting Tools">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="45%" stop-color="#2A2A2A"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="35%" stop-color="#4A4A4A"/>
      <stop offset="65%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#B32F00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 76V40h36"/><path d="M1124 40h36v36"/>
    <path d="M40 724v36h36"/><path d="M1160 724v36h-36"/>
  </g>

  <text x="64" y="90" fill="#FF4500" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">TECHNICAL VIEW</text>
  <text x="64" y="134" fill="#FFFFFF" font-family="'Space Grotesk',sans-serif" font-size="40" font-weight="700">Cutting Tools</text>

  <g>
        <!-- shank -->
        <rect x="700" y="286" width="300" height="300" rx="10" fill="url(#metalH)" stroke="#3A3A3A" stroke-width="2"/>
        <!-- flute body -->
        <path d="M700 286H470l-60 150 60 150h230z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/>
        <g><path d="M700 300C640 318 580 326 520 340" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 346C640 364 580 372 520 386" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 392C640 410 580 418 520 432" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 438C640 456 580 464 520 478" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 484C640 502 580 510 520 524" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 530C640 548 580 556 520 570" fill="none" stroke="#3A3A3A" stroke-width="3"/><path d="M700 576C640 594 580 602 520 616" fill="none" stroke="#3A3A3A" stroke-width="3"/></g>
        <path d="M410 436l-60-40v80z" fill="url(#ember)"/>
        <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M350 631v18"/><path d="M700 631v18"/><path d="M350 640H700"/>
  </g>
  <text x="525" y="624" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">Flute length</text>
        <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M700 631v18"/><path d="M1000 631v18"/><path d="M700 640H1000"/>
  </g>
  <text x="850" y="624" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">Shank</text>
        <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M430 400L300 250"/>
    <circle cx="430" cy="400" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="290" y="255" fill="#FFFFFF" text-anchor="end" font-family="Inter,sans-serif" font-size="17">4-flute geometry</text>
        <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M860 300L900 210"/>
    <circle cx="860" cy="300" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="910" y="215" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">h6 ground shank</text>
        <text x="64" y="700" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="18">Micro-grain carbide · TiAlN coated · Ø 1 – 25 mm</text>
      </g>

  <line x1="64" y1="704" x2="1136" y2="704" stroke="#242424" stroke-width="1"/>
  <text x="64" y="740" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="19">Indicative schematic — dimensions confirmed against your specification at quotation.</text>
  <text x="1136" y="740" fill="#8A8A8A" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="3">MECHAURA INTERNATIONAL</text>
</svg>
