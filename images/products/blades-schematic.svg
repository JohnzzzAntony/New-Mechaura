<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Bandsaw Blades">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="45%" stop-color="#2A2A2A"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="35%" stop-color="#4A4A4A"/>
      <stop offset="65%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#B32F00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 76V40h36"/><path d="M1124 40h36v36"/>
    <path d="M40 724v36h36"/><path d="M1160 724v36h-36"/>
  </g>

  <text x="64" y="90" fill="#FF4500" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">TECHNICAL VIEW</text>
  <text x="64" y="134" fill="#FFFFFF" font-family="'Space Grotesk',sans-serif" font-size="40" font-weight="700">Bandsaw Blades</text>

  <g>
      <rect x="160" y="330" width="920" height="86" fill="url(#metalH)" stroke="#3A3A3A" stroke-width="2"/>
      <g><path d="M160 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M202 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M244 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M286 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M328 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M370 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M412 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M454 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M496 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M538 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M580 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M622 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M664 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M706 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M748 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M790 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M832 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M874 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M916 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M958 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M1000 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/><path d="M1042 330l24-42 18 42z" fill="#141414" stroke="#3A3A3A" stroke-width="2"/></g>
      <path d="M160 372h920" stroke="#FF4500" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.6"/>
      <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M160 461v18"/><path d="M1080 461v18"/><path d="M160 470H1080"/>
  </g>
  <text x="620" y="454" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">Band length 1 000 – 8 000 mm</text>
      <!-- tooth detail -->
      <circle cx="320" cy="600" r="96" fill="#141414" stroke="#FF4500" stroke-width="2"/>
      <path d="M254 640l44-78 30 46 32-52 34 84z" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M254 640h140" stroke="#3A3A3A" stroke-width="2"/>
      <line x1="330" y1="500" x2="374" y2="380" stroke="#FF4500" stroke-width="1.4" stroke-dasharray="5 6"/>
      <text x="450" y="560" fill="#FFFFFF" font-family="Inter,sans-serif" font-size="19">Variable tooth pitch — 2/3, 3/4, 4/6, 5/8 TPI</text>
      <text x="450" y="600" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="18">Bimetal M42 / M51 high-speed steel edge</text>
      <text x="450" y="640" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="18">Widths 13 – 80 mm · Gauge 0.65 – 1.60 mm</text>
      <text x="160" y="300" fill="#8A8A8A" font-family="'Space Grotesk',sans-serif" font-size="17" letter-spacing="2">TOOTH PROFILE</text>
    </g>

  <line x1="64" y1="704" x2="1136" y2="704" stroke="#242424" stroke-width="1"/>
  <text x="64" y="740" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="19">Indicative schematic — dimensions confirmed against your specification at quotation.</text>
  <text x="1136" y="740" fill="#8A8A8A" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="3">MECHAURA INTERNATIONAL</text>
</svg>
