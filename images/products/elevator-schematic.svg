<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Elevator Accessories">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="45%" stop-color="#2A2A2A"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="35%" stop-color="#4A4A4A"/>
      <stop offset="65%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#B32F00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 76V40h36"/><path d="M1124 40h36v36"/>
    <path d="M40 724v36h36"/><path d="M1160 724v36h-36"/>
  </g>

  <text x="64" y="90" fill="#FF4500" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">TECHNICAL VIEW</text>
  <text x="64" y="134" fill="#FFFFFF" font-family="'Space Grotesk',sans-serif" font-size="40" font-weight="700">Elevator Accessories</text>

  <g>
      <!-- T-profile rail -->
      <path d="M180 250h260v58H344v290h-58V308H180z" fill="url(#metal)" stroke="#3A3A3A" stroke-width="2"/>
      <text x="310" y="222" fill="#8A8A8A" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="17" letter-spacing="2">T-GUIDE RAIL</text>
      <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M180 631v18"/><path d="M440 631v18"/><path d="M180 640H440"/>
  </g>
  <text x="310" y="624" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">T70 / T89 / T127</text>
      <line x1="620" y1="200" x2="620" y2="660" stroke="#242424" stroke-width="1" stroke-dasharray="6 8"/>
      <!-- hoistway -->
      <rect x="700" y="220" width="300" height="400" fill="#141414" stroke="#3A3A3A" stroke-width="2"/>
      <g fill="none"><path d="M700 240h300" stroke="#242424" stroke-width="1"/><path d="M700 284h300" stroke="#242424" stroke-width="1"/><path d="M700 328h300" stroke="#242424" stroke-width="1"/><path d="M700 372h300" stroke="#242424" stroke-width="1"/><path d="M700 416h300" stroke="#242424" stroke-width="1"/><path d="M700 460h300" stroke="#242424" stroke-width="1"/><path d="M700 504h300" stroke="#242424" stroke-width="1"/><path d="M700 548h300" stroke="#242424" stroke-width="1"/><path d="M700 592h300" stroke="#242424" stroke-width="1"/></g>
      <rect x="740" y="330" width="220" height="180" rx="6" fill="#0A0A0A" stroke="#FF4500" stroke-width="2.5"/>
      <path d="M850 330V220" stroke="#FF4500" stroke-width="2.5"/>
      <circle cx="850" cy="220" r="26" fill="#141414" stroke="#FF4500" stroke-width="2.5"/>
      <path d="M850 510v70" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="800" y="580" width="100" height="34" rx="6" fill="url(#metal)" stroke="#3A3A3A" stroke-width="2"/>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M850 220L1100 190"/>
    <circle cx="850" cy="220" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="1110" y="195" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Traction machine</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M960 360L1100 400"/>
    <circle cx="960" cy="360" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="1110" y="405" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Door operator</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M850 597L1100 640"/>
    <circle cx="850" cy="597" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="1110" y="645" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Buffer system</text>
      <text x="850" y="690" fill="#8A8A8A" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="17" letter-spacing="2">HOISTWAY ASSEMBLY</text>
    </g>

  <line x1="64" y1="704" x2="1136" y2="704" stroke="#242424" stroke-width="1"/>
  <text x="64" y="740" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="19">Indicative schematic — dimensions confirmed against your specification at quotation.</text>
  <text x="1136" y="740" fill="#8A8A8A" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="3">MECHAURA INTERNATIONAL</text>
</svg>
