<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="CNC Punching Tools">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="45%" stop-color="#2A2A2A"/>
      <stop offset="55%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="35%" stop-color="#4A4A4A"/>
      <stop offset="65%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#B32F00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#FF4500" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 76V40h36"/><path d="M1124 40h36v36"/>
    <path d="M40 724v36h36"/><path d="M1160 724v36h-36"/>
  </g>

  <text x="64" y="90" fill="#FF4500" font-family="'Space Grotesk',sans-serif" font-size="17" font-weight="700" letter-spacing="4.5">TECHNICAL VIEW</text>
  <text x="64" y="134" fill="#FFFFFF" font-family="'Space Grotesk',sans-serif" font-size="40" font-weight="700">CNC Punching Tools</text>

  <g>
      <!-- punch -->
      <rect x="520" y="200" width="160" height="40" rx="6" fill="url(#metalH)" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="560" y="240" width="80" height="190" fill="url(#metalH)" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="560" y="300" width="80" height="6" fill="#FF4500"/>
      <!-- stripper + sheet -->
      <rect x="500" y="430" width="200" height="20" fill="#141414" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="300" y="456" width="600" height="14" fill="#3A3A3A"/>
      <!-- die -->
      <path d="M440 476H555V520H645V476H760V600H440z" fill="url(#metal)" stroke="#3A3A3A" stroke-width="2"/>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M640 260L860 230"/>
    <circle cx="640" cy="260" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="870" y="235" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Punch — Station B / C / D</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M700 440L860 330"/>
    <circle cx="700" cy="440" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="870" y="335" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Stripper</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M300 463L220 380"/>
    <circle cx="300" cy="463" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="210" y="385" fill="#FFFFFF" text-anchor="end" font-family="Inter,sans-serif" font-size="17">Sheet</text>
      <g stroke="#FF4500" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M760 560L860 430"/>
    <circle cx="760" cy="560" r="4" fill="#FF4500" stroke="none"/>
  </g>
  <text x="870" y="435" fill="#FFFFFF" text-anchor="start" font-family="Inter,sans-serif" font-size="17">Die — clearance 0.20 – 0.30 mm</text>
      <g stroke="#FF4500" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M560 641v18"/><path d="M640 641v18"/><path d="M560 650H640"/>
  </g>
  <text x="600" y="634" fill="#FF4500" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="600">Ø 10 mm</text>
      <text x="64" y="700" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="18">Thick and thin turret · Amada, Trumpf, Murata, Strippit compatible</text>
    </g>

  <line x1="64" y1="704" x2="1136" y2="704" stroke="#242424" stroke-width="1"/>
  <text x="64" y="740" fill="#8A8A8A" font-family="Inter,sans-serif" font-size="19">Indicative schematic — dimensions confirmed against your specification at quotation.</text>
  <text x="1136" y="740" fill="#8A8A8A" text-anchor="end" font-family="'Space Grotesk',sans-serif" font-size="15" letter-spacing="3">MECHAURA INTERNATIONAL</text>
</svg>
